<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Loan Calculator</title>
    <style>
        /* Pure, simple CSS - No external libraries */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #FFCC00; /* MTN Yellow */
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #008751; /* MTN Green */
        }
        .header h1 {
            margin: 0;
            color: #008751;
            font-size: 24px;
        }
        .calculator-card {
            background-color: #FFCC00;
            margin: 20px;
            padding: 20px;
            border: 2px solid #008751;
            border-radius: 10px;
            text-align: center;
        }
        .amount-display {
            font-size: 32px;
            font-weight: bold;
            color: #008751;
            margin: 10px 0;
        }
        input[type=range] {
            width: 100%;
            margin: 15px 0;
        }
        .term-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .term-btn {
            flex: 1;
            margin: 0 5px;
            padding: 10px;
            border: 2px solid #008751;
            background-color: white;
            color: #008751;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .term-btn.active {
            background-color: #008751;
            color: #FFCC00;
        }
        .payment-box {
            background-color: #008751;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .payment-amount {
            font-size: 28px;
            font-weight: bold;
            color: #FFCC00;
            margin: 5px 0;
        }
        .apply-btn {
            width: 100%;
            background-color: #008751;
            color: #FFCC00;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>MTN Loans</h1>
        </div>

        <div class="calculator-card">
            <h3 style="margin:0; color:#008751;">LOAN CALCULATOR</h3>
            
            <p style="font-size:12px; font-weight:bold; color:#008751; margin-bottom:0;">LOAN AMOUNT</p>
            <!-- This ID is used by the script -->
            <div class="amount-display" id="amountText">GHC 50,000.00</div>
            
            <!-- This triggers the script when moved -->
            <input type="range" id="slider" min="500" max="50000" step="500" value="50000" oninput="calculate()">
            
            <p style="font-size:12px; font-weight:bold; color:#008751;">LOAN TERM</p>
            <div class="term-buttons">
                <button type="button" class="term-btn" id="btn6" onclick="setTerm(6)">6 months</button>
                <button type="button" class="term-btn active" id="btn12" onclick="setTerm(12)">12 months</button>
                <button type="button" class="term-btn" id="btn24" onclick="setTerm(24)">24 months</button>
            </div>

            <div class="payment-box">
                <p style="margin:0; font-size:12px; letter-spacing:1px;">MONTHLY PAYMENT</p>
                <div class="payment-amount" id="paymentText">GHC 4,268.93</div>
            </div>

            <button class="apply-btn" onclick="alert('Calculator is working! Proceeding to Application...')">APPLY NOW</button>
        </div>
    </div>

    <!-- PURE JAVASCRIPT -->
    <script>
        // Show this alert to prove JavaScript is running
        alert("JAVASCRIPT LOADED SUCCESSFULLY!");

        var currentMonths = 12;

        function calculate() {
            // 1. Get the amount from the slider
            var amount = document.getElementById("slider").value;

            // 2. Change the amount text on the screen
            document.getElementById("amountText").innerHTML = "GHC " + parseFloat(amount).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // 3. Do the math
            var rate = 0.045 / 12; // 4.5% interest
            var payment = amount * rate * Math.pow(1 + rate, currentMonths) / (Math.pow(1 + rate, currentMonths) - 1);

            // 4. Change the payment text on the screen
            document.getElementById("paymentText").innerHTML = "GHC " + payment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function setTerm(months) {
            currentMonths = months;

            // Reset button colors
            document.getElementById("btn6").className = "term-btn";
            document.getElementById("btn12").className = "term-btn";
            document.getElementById("btn24").className = "term-btn";

            // Set active button color
            if (months === 6) document.getElementById("btn6").className = "term-btn active";
            if (months === 12) document.getElementById("btn12").className = "term-btn active";
            if (months === 24) document.getElementById("btn24").className = "term-btn active";

            // Recalculate
            calculate();
        }

        // Run once when page loads
        calculate();
    </script>
</body>
</html>
